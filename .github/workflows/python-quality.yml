name: Python quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.14"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.6"
      - name: Sync locked environment
        run: uv sync --locked --all-packages --group dev
      - name: Compile Python sources
        run: uv run python -m compileall -q core/src server/src tests
      - name: Check imports and syntax rules
        run: uv run ruff check core/src server/src tests
      - name: Check typed boundaries
        run: >-
          uv run mypy
          core/src/document_qa/schemas
          core/src/document_qa/profiles.py
          server/src/document_qa_server/persistence
          server/src/document_qa_server/settings.py
      - name: Run Python tests
        run: uv run python -m unittest discover -s tests -v
      - name: Build both distributions
        if: matrix.python-version == '3.12'
        run: uv build --package document-qa
      - name: Build server distribution
        if: matrix.python-version == '3.12'
        run: uv build --package document-qa-server
